# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Spring Session を止める spring.session.store-type=none は Boot 4 で廃止された
# (2026-10-22 の Boot 4 移行)。フルコンテキストを起動するのは test プロファイルを
# 使う ApplicationContextTest だけで、他は @WebMvcTest / @DataJpaTest のスライス＝
# SessionAutoConfiguration を読み込まないため、この指定はもともと実質無効だった。
# 本当に止める必要が出たら spring.autoconfigure.exclude で除外すること。

# Logging
logging.level.root=WARN
# logging.level.io.github.tknknk.yucale=INFO
